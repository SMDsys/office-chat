name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: node --check
        run: node --check web/app.js

  windows:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build Windows exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o dist/OfficeChat.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeChat-win64
          path: dist/OfficeChat.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build package
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/OfficeChat.exe .
          cp packaging/config.json packaging/install.bat packaging/uninstall.bat \
             packaging/run.bat "packaging/Подключиться.bat" "packaging/Включить HTTPS.bat" \
             "packaging/Доверять сертификату.bat" "packaging/Убрать доверие.bat" \
             packaging/README.txt dist/
          cd dist
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "../OfficeChat-${VERSION}-win64.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          files: OfficeChat-*-win64.zip
          generate_release_notes: true
